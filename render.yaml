services:
  - type: web
    name: twitterati
    runtime: node
    buildCommand: yarn install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RETTIWT_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: twitterati-db
          property: connectionString

  - type: web
    name: cryptohire
    runtime: node
    rootDir: cryptohire
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWITTER_COOKIE
        sync: false          # set manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: cryptohire-db
          property: connectionString

databases:
  - name: twitterati-db
    databaseName: twitterati
    user: twitterati
    plan: free

  - name: cryptohire-db
    databaseName: cryptohire
    user: cryptohire
    plan: free
